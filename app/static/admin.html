<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Admin Console</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0c14;
    --panel: #14151f;
    --panel-alt: #1a1c2a;
    --border: #262838;
    --text: #f1f1f6;
    --muted: #8b8da3;
    --accent: #7c5cff;
    --accent-2: #ff5ca8;
    --accent-grad: linear-gradient(135deg, #7c5cff, #ff5ca8);
    --accent-soft: rgba(124,92,255,0.15);
    --error: #ff5c7a;
    --success: #2fd991;
    --warn: #ffb545;
    --info: #4cc9f0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(1200px 500px at 10% -10%, rgba(124,92,255,0.14), transparent),
      var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 32px 16px 64px;
  }
  main { max-width: 1200px; margin: 0 auto; }
  h1 {
    font-size: 22px;
    margin: 0 0 4px;
    background: var(--accent-grad);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    display: inline-block;
  }
  p.subtitle { color: var(--muted); margin: 0 0 24px; font-size: 14px; }
  a.back { color: var(--accent); font-size: 13px; text-decoration: none; }
  a.back:hover { text-decoration: underline; }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    margin-top: 20px;
    overflow-x: auto;
  }
  .card h2 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    margin: 0 0 14px;
    font-weight: 700;
  }
  table { width: 100%; border-collapse: collapse; font-size: 13px; white-space: nowrap; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; }
  tr:hover td { background: var(--panel-alt); }
  td.topic { white-space: normal; max-width: 320px; }

  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .badge.queued { background: rgba(139,141,163,0.16); color: var(--muted); }
  .badge.running { background: rgba(76,201,240,0.16); color: var(--info); }
  .badge.done { background: rgba(47,217,145,0.16); color: var(--success); }
  .badge.failed { background: rgba(255,92,122,0.16); color: var(--error); }
  .badge.admin { background: var(--accent-soft); color: var(--accent); }

  a.action { color: var(--accent); text-decoration: none; margin-right: 10px; font-size: 12px; }
  a.action:hover { text-decoration: underline; }

  .denied, .loading {
    color: var(--muted);
    font-size: 14px;
    padding: 40px 0;
    text-align: center;
  }
  .denied { color: var(--error); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <a class="back" href="/">&larr; Back to app</a>
  <h1>Admin Console</h1>
  <p class="subtitle">Every user and every generated video, across all accounts.</p>

  <div id="loading" class="loading">Loading...</div>
  <div id="denied" class="denied" hidden>You don't have admin access.</div>

  <div id="content" hidden>
    <div class="card">
      <h2>Users</h2>
      <table>
        <thead>
          <tr><th>Username</th><th>Role</th><th>Videos</th><th>Done</th><th>Joined</th></tr>
        </thead>
        <tbody id="users-body"></tbody>
      </table>
    </div>

    <div class="card">
      <h2>All Videos</h2>
      <table>
        <thead>
          <tr><th>Topic</th><th>User</th><th>Status</th><th>Length</th><th>Created</th><th></th></tr>
        </thead>
        <tbody id="jobs-body"></tbody>
      </table>
    </div>
  </div>
</main>

<script>
  const loadingEl = document.getElementById("loading");
  const deniedEl = document.getElementById("denied");
  const contentEl = document.getElementById("content");
  const usersBody = document.getElementById("users-body");
  const jobsBody = document.getElementById("jobs-body");

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str == null ? "" : String(str);
    return div.innerHTML;
  }

  function formatDate(iso) {
    return new Date(iso).toLocaleString();
  }

  function formatDuration(totalSeconds) {
    if (!totalSeconds) return "";
    const s = Math.round(totalSeconds);
    return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
  }

  function badgeClass(status) {
    if (status === "done") return "done";
    if (status === "failed") return "failed";
    if (status === "queued") return "queued";
    return "running";
  }

  async function loadUsers() {
    const res = await fetch("/admin/users");
    if (!res.ok) return false;
    const data = await res.json();
    usersBody.innerHTML = data.users.map((u) => `
      <tr>
        <td>${escapeHtml(u.username)}</td>
        <td>${u.is_admin ? '<span class="badge admin">Admin</span>' : "User"}</td>
        <td>${u.job_count || 0}</td>
        <td>${u.done_count || 0}</td>
        <td>${formatDate(u.created_at)}</td>
      </tr>
    `).join("") || `<tr><td colspan="5">No users yet.</td></tr>`;
    return true;
  }

  async function loadJobs() {
    const res = await fetch("/admin/jobs?limit=200");
    if (!res.ok) return false;
    const data = await res.json();
    jobsBody.innerHTML = data.jobs.map((j) => `
      <tr>
        <td class="topic">${escapeHtml(j.topic)}</td>
        <td>${escapeHtml(j.username || "(deleted user)")}</td>
        <td><span class="badge ${badgeClass(j.status)}">${j.status.replace("_", " ")}</span></td>
        <td>${j.status === "done" && j.actual_duration_seconds ? formatDuration(j.actual_duration_seconds) : (j.length_minutes ? `~${j.length_minutes} min` : "")}</td>
        <td>${formatDate(j.created_at)}</td>
        <td>${j.status === "done" ? `<a class="action" href="/download/${j.job_id}" target="_blank">Watch</a>` : ""}</td>
      </tr>
    `).join("") || `<tr><td colspan="6">No videos yet.</td></tr>`;
    return true;
  }

  (async () => {
    try {
      const me = await fetch("/auth/me");
      if (!me.ok) {
        window.location.href = "/";
        return;
      }
      const meData = await me.json();
      if (!meData.is_admin) {
        loadingEl.hidden = true;
        deniedEl.hidden = false;
        return;
      }

      const [usersOk, jobsOk] = await Promise.all([loadUsers(), loadJobs()]);
      loadingEl.hidden = true;
      if (usersOk && jobsOk) {
        contentEl.hidden = false;
      } else {
        deniedEl.textContent = "Failed to load admin data.";
        deniedEl.hidden = false;
      }
    } catch (err) {
      loadingEl.hidden = true;
      deniedEl.textContent = `Error: ${err.message}`;
      deniedEl.hidden = false;
    }
  })();
</script>
</body>
</html>
